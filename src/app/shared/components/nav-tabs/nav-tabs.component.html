<nav class="nav-tabs" [attr.aria-label]="ariaLabel()">
  @for (t of items(); track t.link) {
    <a
      class="nav-tabs__link"
      [routerLink]="t.link"
      routerLinkActive="nav-tabs__link--active"
      [routerLinkActiveOptions]="{ exact: t.exact ?? true }"
    >
      {{ t.label }}
      @if (t.stato) {
        <span [class]="'nav-tabs__stato nav-tabs__stato--' + (t.tono ?? 'neutral')">
          {{ t.stato }}
        </span>
      }
      @if (t.conteggio !== undefined) {
        <span
          class="nav-tabs__conteggio tabular-nums"
          [class.nav-tabs__conteggio--zero]="t.conteggio === 0"
        >
          {{ t.conteggio }}
        </span>
      }
    </a>
  }
</nav>
