@switch (kind()) {
  @case ('values') {
    <!--
      ⭐ **Le scelte sono i valori PRESENTI nelle righe**, non un elenco
      dichiarato: così non c'è una voce che non dà risultati.

      ⚠️ `labelOnly` tiene la larghezza stabile: in un'intestazione di colonna il
      controllo non deve allargarsi col valore scelto, o la tabella balla.
    -->
    <app-select-menu
      [options]="menuOptions()"
      [multiple]="true"
      [values]="selezionati()"
      [ariaLabel]="etichettaValori()"
      [chipLabel]="columnLabel()"
      [triggerIcon]="escludendo() ? 'pi-ban' : undefined"
      placeholder="Tutti"
      [compact]="true"
      [labelOnly]="true"
      [fullWidth]="true"
      [includeEmptyOption]="false"
      [searchable]="true"
      [searchPlaceholder]="'Cerca fra i valori…'"
      [searchAriaLabel]="'Cerca fra i valori di ' + columnLabel()"
      (valuesChange)="onValues($event)"
    >
      <!--
        ⭐ **IL VERSO E IL «TUTTI» STANNO NEL PANNELLO**, non in barra: agiscono
        sulle opzioni di QUESTO menu, e fuori tornerebbero a sembrare una
        seconda dimensione di filtro — che è il difetto per cui «Ambito» è stato
        ritirato dai Corrispettivi (`regole-stile-ui` §5, slot `panelLead`).
      -->
      <span panelLead class="column-filter__mode">
        <app-segmented
          [flat]="true"
          [options]="MODI"
          [value]="escludendo() ? 'escludi' : 'includi'"
          [ariaLabel]="'Verso del filtro ' + columnLabel()"
          (valueChange)="onModo($event)"
        />
        <!--
          ⚠️ **«Tutti» è il `(Tutto)` di Danea, e qui SVUOTA la selezione**: in
          questo modello «nessun valore scelto» è già «nessuna restrizione», cioè
          tutte le righe. Spuntarli tutti a uno a uno darebbe lo stesso
          risultato con venti clic e un filtro che sembra attivo.
        -->
        <button
          type="button"
          class="column-filter__all"
          [disabled]="selezionati().length === 0"
          [attr.aria-label]="'Mostra tutti i valori di ' + columnLabel()"
          (click)="onTutti()"
        >
          Tutti
        </button>
      </span>
    </app-select-menu>
  }

  @case ('text') {
    <input
      type="search"
      class="column-filter__text"
      [id]="campoTestoId"
      [value]="testo()"
      [attr.aria-label]="'Filtra per ' + columnLabel()"
      placeholder="Contiene…"
      (input)="onText($event)"
    />
  }

  @case ('range') {
    <!--
      ⚠️ **Due campi e non uno**: un intervallo ha due estremi indipendenti, e
      ognuno può restare vuoto. Il tastierino decimale si apre da sé
      sul telefono senza rifiutare il segno meno, che serve su resi e rettifiche.
    -->
    <span class="column-filter__range">
      <input
        type="text"
        inputmode="decimal"
        class="column-filter__number"
        [id]="campoDaId"
        [value]="minimo() ?? ''"
        [attr.aria-label]="columnLabel() + ' da'"
        placeholder="da"
        (input)="onMin($event)"
      />
      <input
        type="text"
        inputmode="decimal"
        class="column-filter__number"
        [id]="campoAId"
        [value]="massimo() ?? ''"
        [attr.aria-label]="columnLabel() + ' a'"
        placeholder="a"
        (input)="onMax($event)"
      />
    </span>
  }

  @case ('date') {
    <!--
      ⛔ **Due campi DATA, non due caselle numeriche.** Una colonna data
      dichiarata `range` mostrava due caselle in cui non c'è niente da scrivere:
      su una data si sceglie un giorno, non si digita un numero.

      ⚠️ Il valore viaggia in ISO — è quello che `app-date-input` emette, ed è
      l'unico formato in cui il confronto fra stringhe è già quello giusto.
    -->
    <span class="column-filter__range">
      <app-date-input
        [inputId]="campoDalId"
        [value]="dal()"
        [ariaLabel]="columnLabel() + ' dal'"
        placeholder="dal"
        [compact]="true"
        [fullWidth]="true"
        (valueChange)="onDal($event)"
      />
      <app-date-input
        [inputId]="campoAlId"
        [value]="al()"
        [ariaLabel]="columnLabel() + ' al'"
        placeholder="al"
        [compact]="true"
        [fullWidth]="true"
        (valueChange)="onAl($event)"
      />
    </span>
  }
}
