<div class="action-menu" [class.action-menu--open]="open()">
  <!--
    Con `triggerLabel` il pulsante porta il nome del comando e si veste come un
    bottone secondario; senza, resta il quadrato «···» delle righe di tabella.
    `aria-label` copre comunque il caso a sola icona.
  -->
  <button
    type="button"
    class="action-menu__trigger"
    [class.action-menu__trigger--labelled]="triggerLabel()"
    [attr.aria-label]="triggerLabel() ? null : ariaLabel()"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    (click)="toggle($event)"
  >
    <i class="pi {{ triggerIcon() }}" aria-hidden="true"></i>
    @if (triggerLabel(); as label) {
      <span class="action-menu__trigger-label">{{ label }}</span>
      <i class="pi pi-chevron-down action-menu__trigger-caret" aria-hidden="true"></i>
    }
  </button>

  @if (open()) {
    <ul class="action-menu__panel" role="menu" [attr.aria-label]="ariaLabel()">
      @for (item of items(); track item.id) {
        <li class="action-menu__item" role="none">
          <button
            type="button"
            role="menuitem"
            class="action-menu__item-btn"
            [class.action-menu__item-btn--danger]="item.danger"
            (click)="onSelect($event, item.id)"
          >
            @if (item.icon) {
              <i class="pi {{ item.icon }}" aria-hidden="true"></i>
            }
            <span>{{ item.label }}</span>
          </button>
        </li>
      }
    </ul>
  }
</div>
