<dialog
  #dialog
  class="confirm-dialog"
  aria-labelledby="confirm-dialog-title"
  (close)="onNativeClose()"
>
  <h2 id="confirm-dialog-title" class="confirm-dialog__title">{{ title() }}</h2>
  <p class="confirm-dialog__message">{{ message() }}</p>
  <ng-content />

  <div class="confirm-dialog__actions">
    @if (!acknowledge()) {
      <app-button
        [variant]="emphasis() === 'cancel' ? 'primary' : 'secondary'"
        [disabled]="busy()"
        (click)="onCancel()"
      >
        {{ cancelLabel() }}
      </app-button>
    }
    <app-button
      [variant]="danger() ? 'danger' : emphasis() === 'cancel' ? 'secondary' : 'primary'"
      [loading]="busy()"
      [disabled]="busy()"
      (click)="onConfirm()"
    >
      {{ confirmLabel() }}
    </app-button>
  </div>
</dialog>
