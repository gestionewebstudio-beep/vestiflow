<!--
  ⛔ **UNA VOCE SOLA NON È UN PERCORSO** — proprietario, 01/09/2026: «esiste
  ancora una doppia riga inutile».

  Su una pagina di primo livello il percorso è «Fornitori» e il titolo è
  «Fornitori»: la stessa parola due volte, una sopra l'altra, per una riga di
  altezza che su un elenco si paga in righe di dati.

  ⚠️ **Da due voci in su resta**, perché lì dice qualcosa che il titolo non
  dice: «Documenti › Ordini fornitori» racconta dove ci si trova, «Fornitori»
  sopra «Fornitori» no.
-->
@if (crumbs().length > 1) {
  <nav
    class="breadcrumbs"
    [class.breadcrumbs--hide-mobile]="hideOnOrderForm()"
    aria-label="Percorso di navigazione"
  >
    <ol class="breadcrumbs__list">
      @for (crumb of crumbs(); track $index) {
        <li class="breadcrumbs__item">
          @if (!$first) {
            <i class="pi pi-angle-right breadcrumbs__sep" aria-hidden="true"></i>
          }
          @if (crumb.link) {
            <a class="breadcrumbs__link" [routerLink]="crumb.link">{{ crumb.label }}</a>
          } @else {
            <span
              class="breadcrumbs__current"
              [class.breadcrumbs__current--last]="$last"
              [attr.aria-current]="$last ? 'page' : null"
            >
              {{ crumb.label }}
            </span>
          }
        </li>
      }
    </ol>
  </nav>
}
