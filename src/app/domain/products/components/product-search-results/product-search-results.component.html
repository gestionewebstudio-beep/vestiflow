<ul class="psr__list">
  @for (item of results(); track item.variantId) {
    <li class="psr__row">
      <button
        type="button"
        class="psr__item"
        title="Aggiungi alla riga"
        (click)="pick(item.variantId)"
      >
        <span class="psr__thumb">
          @if (item.imageUrl) {
            <img [src]="item.imageUrl" [alt]="item.title" loading="lazy" />
          } @else {
            <i class="pi pi-image" aria-hidden="true"></i>
          }
        </span>
        <span class="psr__info">
          <span class="psr__title">{{ item.title }}</span>
          @if (resultCodes(item); as codes) {
            <span class="psr__codes">{{ codes }}</span>
          }
          @if (stockStatus(item); as status) {
            <span
              class="psr__stock"
              [class.psr__stock--ok]="status === StockStatus.Ok"
              [class.psr__stock--low]="status === StockStatus.Low"
              [class.psr__stock--empty]="status === StockStatus.Empty"
            >
              {{ stockLabel(item) }}
            </span>
          }
        </span>
        @if (priceLabel(item); as price) {
          <span class="psr__price">{{ price }}</span>
        }
      </button>
      <!-- Seconda azione: apre la scheda dell'articolo invece di aggiungerlo.
           La specifica §8 la chiamava «nome cliccabile», ma la riga È già un
           pulsante e un pulsante dentro un pulsante non è markup valido: stessa
           idea, due bersagli affiancati. -->
      <button
        type="button"
        class="psr__open"
        [attr.aria-label]="'Apri anagrafica di ' + item.title"
        title="Apri anagrafica"
        (click)="openDetail(item.productId)"
      >
        <i class="pi pi-external-link" aria-hidden="true"></i>
      </button>
    </li>
  }
</ul>
