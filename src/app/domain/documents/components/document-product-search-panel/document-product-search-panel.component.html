<section class="gr-product-search">
  <div class="gr-product-search__head">
    <label class="gr-product-search__label" for="gr-product-search-input">Cerca prodotto</label>
    <p class="gr-product-search__hint">
      Cerca per nome, SKU o EAN. La riga aggiunge l'articolo al documento; l'icona in coda ne apre
      l'anagrafica.
    </p>
    <div class="gr-product-search__field">
      <input
        id="gr-product-search-input"
        class="gr-product-search__input"
        type="search"
        [ngModel]="searchQuery()"
        placeholder="Nome, SKU, EAN, codice fornitore…"
        autocomplete="off"
        (ngModelChange)="onSearchInput($event)"
        (keydown)="onSearchKeydown($event)"
      />
      <button
        type="button"
        class="gr-product-search__search-btn"
        aria-label="Cerca prodotto"
        (click)="runSearch()"
      >
        <i class="pi pi-search" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  @if (searchQuery().trim().length === 0) {
    <app-empty-state
      icon="pi-search"
      title="Digita per cercare"
      description="Inserisci almeno un carattere e premi Cerca o Invio."
    />
  } @else if (results().length === 0) {
    <!-- Non trovarlo non e' un vicolo cieco: e' il momento in cui l'articolo si
         crea, e da qui il nome digitato arriva gia' nella scheda nuova. -->
    <app-empty-state
      icon="pi-search"
      title="Nessun prodotto trovato"
      [description]="emptyDescription()"
      [ctaLabel]="canCreate() ? 'Crea articolo' : ''"
      (ctaClick)="requestCreate()"
    />
  } @else {
    <app-product-search-results
      [results]="results()"
      (variantSelected)="selectVariant($event)"
      (detailRequested)="requestDetail($event)"
    />
  }

  <div class="gr-product-search__actions">
    <!-- Il comando esiste UNA volta sola. Quando la ricerca non trova niente sta
         nello stato vuoto, dove l'occhio è già; negli altri casi sta qui, perché
         si può sapere in partenza che l'articolo non esiste. Averlo in entrambi
         i posti — com'era — significa mostrarlo due volte proprio nel momento in
         cui serve, e chi lo vede si chiede quale dei due faccia cosa. -->
    @if (showCreateInActions()) {
      <app-button type="button" variant="secondary" (click)="requestCreate()">
        <i class="pi pi-plus" aria-hidden="true"></i>
        Crea articolo
      </app-button>
    }
    <app-button type="button" variant="ghost" (click)="close()">Chiudi</app-button>
  </div>
</section>
