@if (linked()) {
  <div class="doc-product-cell doc-product-cell--linked">
    <p class="doc-product-cell__linked-label" [title]="linkedLabel()">
      {{ linkedLabel() || 'Prodotto collegato' }}
    </p>
    <button
      type="button"
      class="doc-product-cell__search"
      tabindex="-1"
      [disabled]="disabled()"
      aria-label="Cerca un altro prodotto"
      title="Cerca un altro prodotto"
      (mousedown)="$event.preventDefault()"
      (click)="openSearch($event)"
    >
      <i class="pi pi-search" aria-hidden="true"></i>
    </button>
    <button
      type="button"
      class="doc-product-cell__search"
      tabindex="-1"
      [disabled]="disabled()"
      aria-label="Scollega articolo e modifica il testo"
      title="Scollega articolo e modifica il testo"
      (mousedown)="$event.preventDefault()"
      (click)="requestUnlink($event)"
    >
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
    <button
      type="button"
      class="doc-product-cell__link-action"
      tabindex="-1"
      [disabled]="disabled()"
      (click)="openDetail($event)"
    >
      Apri anagrafica
    </button>
  </div>
} @else {
  <div class="doc-product-cell">
    <div class="doc-product-cell__field" [class.doc-product-cell__field--invalid]="invalid()">
      <input
        class="doc-product-cell__input"
        type="text"
        [id]="inputId() || null"
        [disabled]="disabled()"
        [value]="value()"
        [attr.aria-invalid]="invalid() ? true : null"
        [attr.aria-expanded]="suggestionsOpen()"
        [attr.aria-controls]="listboxId()"
        aria-label="Nome prodotto"
        autocomplete="off"
        placeholder="Cerca o crea un articolo"
        (input)="onInput($any($event.target).value)"
        (focus)="onFocus()"
        (blur)="onBlur()"
        (keydown)="onKeydown($event)"
      />
      <button
        type="button"
        class="doc-product-cell__search"
        tabindex="-1"
        [disabled]="disabled()"
        aria-label="Cerca prodotto"
        (mousedown)="$event.preventDefault()"
        (click)="openSearch($event)"
      >
        <i class="pi pi-search" aria-hidden="true"></i>
      </button>
    </div>
    <!--
      Nessun messaggio «nessun articolo trovato»: senza risultati il pannello
      non si apre. Non trovare nulla non è un errore — si continua a compilare
      la riga a mano, e la creazione dell'articolo ha le sue vie proprie
      («Completa anagrafica» qui sotto, «Nuovo prodotto» sopra le righe).
    -->
    @if (suggestionsOpen() && suggestions().length > 0) {
      <app-document-line-suggestions
        [items]="suggestionItems()"
        [activeIndex]="activeSuggestionIndex()"
        [listboxId]="listboxId()"
        ariaLabel="Suggerimenti prodotto"
        (picked)="pickAt($event)"
      />
    }
    <button
      type="button"
      class="doc-product-cell__link-action"
      tabindex="-1"
      [disabled]="disabled()"
      (click)="openAnagraphic($event)"
    >
      Completa anagrafica
    </button>
  </div>
}
