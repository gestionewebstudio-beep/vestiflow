<!--
  UN campo solo, agganciato o no (11/08/2026).

  Prima erano due celle diverse a seconda che la riga avesse un articolo: un
  testo fisso con tre icone, oppure un campo con la lente. Il nome scritto sul
  documento è la descrizione di QUELLA riga, non dell'anagrafica — come il
  prezzo di riga non riscrive il listino — quindi resta modificabile anche
  quando l'articolo c'è, e quello che si scrive non torna indietro sulla scheda
  articolo. Lo spazio dove finisce esiste già: `description` sull'arrivo merce e
  sull'ordine fornitore, `title` sull'ordine cliente, dove lo schema lo chiama
  «snapshot al momento della vendita».

  La **x** che scollegava non c'è più: era nata per svuotare la riga, e la riga
  si toglie col cestino in fondo. Due gesti per la stessa cosa, di cui uno
  faceva tre cose diverse nelle tre maschere.
-->
<div class="doc-product-cell" [class.doc-product-cell--linked]="linked()">
  <div class="doc-product-cell__field" [class.doc-product-cell__field--invalid]="invalid()">
    <input
      class="doc-product-cell__input"
      appFirstClickSelects
      type="text"
      [attr.id]="inputId() || null"
      [disabled]="disabled()"
      [value]="value()"
      [title]="value()"
      [attr.aria-invalid]="invalid() ? true : null"
      [attr.aria-expanded]="suggestionsOpen()"
      [attr.aria-controls]="listboxId()"
      aria-label="Nome prodotto"
      autocomplete="off"
      placeholder="Cerca o crea un articolo"
      (input)="onInput($any($event.target).value)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown)="onKeydown($event)"
    />
    <button
      type="button"
      class="doc-product-cell__search"
      tabindex="-1"
      [disabled]="disabled()"
      [attr.aria-label]="linked() ? 'Cerca un altro prodotto' : 'Cerca prodotto'"
      [title]="linked() ? 'Cerca un altro prodotto' : 'Cerca prodotto'"
      (mousedown)="$event.preventDefault()"
      (click)="openSearch($event)"
    >
      <i class="pi pi-search" aria-hidden="true"></i>
    </button>
    <!--
      «Apri anagrafica» non ha più un'icona sua (11/08/2026). Stava su OGNI riga
      di OGNI documento, in una colonna che già tronca il nome, per un gesto che
      si fa di rado. Ci si arriva dalla lente: il pannello si apre col nome della
      riga, quindi l'articolo collegato è il primo risultato, e da lì l'icona in
      coda apre la scheda. Un gesto in più in un caso raro, un'icona in meno
      sempre.
    -->
  </div>
  <!--
    Nessun messaggio «nessun articolo trovato»: senza risultati il pannello non
    si apre. Non trovare nulla non è un errore — si continua a compilare la riga
    a mano, e la creazione dell'articolo ha le sue vie proprie.

    Su una riga già agganciata il pannello resta muto: è il magazzino di
    `DocumentProductSuggestStore`, non una regola di questa cella.
  -->
  @if (suggestionsOpen() && suggestions().length > 0) {
    <app-document-line-suggestions
      [items]="suggestionItems()"
      [activeIndex]="activeSuggestionIndex()"
      [listboxId]="listboxId()"
      ariaLabel="Suggerimenti prodotto"
      (picked)="pickAt($event)"
    />
  }
</div>
