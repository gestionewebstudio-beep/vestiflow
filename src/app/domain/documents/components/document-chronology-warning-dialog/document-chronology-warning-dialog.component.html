<app-confirm-dialog
  [open]="open()"
  title="Numerazione fuori ordine"
  [message]="message()"
  confirmLabel="Sì, salva comunque"
  cancelLabel="No, torna al documento"
  [busy]="busy()"
  (confirmed)="confirmed.emit()"
  (dismissed)="cancelled.emit()"
>
  <ul class="chrono-warning__list">
    @for (anomaly of anomalies(); track anomaly.id) {
      <li class="chrono-warning__item">
        <span class="chrono-warning__ref">{{ etichetta(anomaly) }}</span>
        <span class="chrono-warning__date">{{ giorno(anomaly.documentDate) }}</span>
      </li>
    }
  </ul>

  <label class="chrono-warning__mute">
    <input
      type="checkbox"
      [checked]="dontShowAgain()"
      (change)="dontShowAgainChange.emit($any($event.target).checked)"
    />
    <span>
      Non mostrare più questo avviso per questo tipo di documento
      <small class="chrono-warning__mute-note">Una volta spento non si riaccende.</small>
    </span>
  </label>
</app-confirm-dialog>
