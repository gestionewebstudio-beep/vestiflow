@if (items().length > 0 || tailLabel()) {
  <div class="doc-suggestions" [class.doc-suggestions--above]="placement() === 'above'">
    @if (items().length > 0) {
      <ul
        class="doc-suggestions__list"
        role="listbox"
        [attr.id]="listboxId() || null"
        [attr.aria-label]="ariaLabel()"
      >
        @for (item of items(); track $index; let i = $index) {
          <!--
            ⚠️ `tabindex="-1"`, e NON `0`: le voci di un elenco non sono
            fermate del Tab. Con `0` ognuna lo era, e il Tab entrava
            nell'elenco invece di cambiare cella — poi il pannello si chiudeva
            sotto la voce appena raggiunta e il fuoco finiva sul `<body>`,
            cioè da nessuna parte (misurato il 18/08/2026 sulla scheda
            articolo). Il fuoco resta sull'input: le frecce muovono
            l'evidenziazione, Invio sceglie, Tab cambia campo. È il modello
            ARIA della listbox, ed è la regola §4.3 della specifica righe.

            ⚠️ I gestori Invio/Spazio qui sotto ora non si raggiungono più da
            tastiera — ci arrivavano solo perché la voce era una fermata del
            Tab. Non è una perdita: la scelta da tastiera la fa l'input della
            cella, che ha la sua macchina dei tasti ed è registrata («Invio
            prende la voce evidenziata e NON avanza»). Restano perché
            toglierli è una pulizia, e va fatta con la progettazione della
            tabulazione insieme al resto — non di straforo qui.
          -->
          <li
            role="option"
            tabindex="-1"
            class="doc-suggestions__item"
            [class.doc-suggestions__item--active]="i === activeIndex()"
            [attr.aria-selected]="i === activeIndex()"
            (mousedown)="$event.preventDefault()"
            (click)="picked.emit(i)"
            (keydown.enter)="pickWithKeyboard($event, i)"
            (keydown.space)="pickWithKeyboard($event, i)"
          >
            <span class="doc-suggestions__title">{{ item.title }}</span>
            @if (item.detail) {
              <span class="doc-suggestions__detail">{{ item.detail }}</span>
            }
          </li>
        }
      </ul>
    }
    @if (tailLabel(); as tail) {
      <button
        type="button"
        class="doc-suggestions__tail"
        [class.doc-suggestions__tail--active]="tailActive()"
        (mousedown)="$event.preventDefault()"
        (click)="tailPicked.emit()"
      >
        {{ tail }}
      </button>
    }
  </div>
}
