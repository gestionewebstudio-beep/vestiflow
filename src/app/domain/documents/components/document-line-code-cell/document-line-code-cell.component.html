@if (linked()) {
  <p class="doc-code-cell__linked" [title]="linkedValue()">{{ linkedValue() || '—' }}</p>
} @else {
  <div class="doc-code-cell">
    <input
      class="doc-code-cell__input"
      type="text"
      [id]="inputId() || null"
      [disabled]="disabled()"
      [value]="value()"
      [placeholder]="placeholder()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-expanded]="suggestionsOpen()"
      [attr.aria-controls]="listboxId()"
      autocomplete="off"
      (input)="onInput($any($event.target).value)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown)="onKeydown($event)"
    />
    @if (suggestionsOpen() && suggestions().length > 0) {
      <app-document-line-suggestions
        [items]="suggestionItems()"
        [activeIndex]="activeSuggestionIndex()"
        [listboxId]="listboxId()"
        [ariaLabel]="'Suggerimenti ' + ariaLabel()"
        (picked)="pickAt($event)"
      />
    }
  </div>
}
