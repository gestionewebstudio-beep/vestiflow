<app-document-line-card
  [lineIndex]="lineIndex()"
  [open]="open()"
  [readOnly]="disabled()"
  [canRemove]="canRemove()"
  [title]="line().controls.description.value"
  [variantLabel]="line().controls.variantLabel.value"
  [meta]="metaItems()"
  (toggled)="toggle()"
  (removeRequested)="removed.emit(lineIndex())"
  (removed)="removed.emit(lineIndex())"
>
  <!--
    Tre valori nella striscia: quantità, prezzo e totale. Sono i tre che si
    leggono senza aprire, e l'ultimo è marcato perché è quello che si guarda
    per primo scorrendo un documento.
  -->
  <ng-container cardControls>
    <app-document-line-card-control label="Qtà">
      <!-- Riga di riferimento: nessuna quantità, come sul desktop. Vale la
           stessa ragione: 0 si legge «zero pezzi», non «non pertinente». -->
      @if (!line().controls.isReference.value) {
        <input
          class="sd-card__num"
          type="number"
          min="1"
          step="1"
          inputmode="numeric"
          [formControl]="line().controls.quantity"
          [attr.aria-label]="'Quantità riga ' + (lineIndex() + 1)"
        />
      }
    </app-document-line-card-control>

    <app-document-line-card-control [label]="priceLabel()">
      <input
        class="sd-card__num"
        type="text"
        inputmode="decimal"
        placeholder="0,00"
        [formControl]="line().controls.unitPrice"
        [attr.aria-label]="priceLabel() + ' riga ' + (lineIndex() + 1)"
      />
    </app-document-line-card-control>

    <app-document-line-card-control label="Totale">
      <span class="sd-card__total tabular-nums">{{ totalLabel() }}</span>
    </app-document-line-card-control>
  </ng-container>

  <ng-container cardBody>
    <app-document-line-card-group label="Articolo" [first]="true" />

    <!--
      I tre campi codice ancorano la scelta fra più corrispondenze esatte: uno
      solo per volta la mostra, quello da cui si è confermato. Su mobile la si
      prende toccando, e lo sfocamento conferma come il Tab sul desktop.
    -->
    <app-document-line-card-field
      label="Cod. articolo"
      [controlId]="idPrefix() + '-m-code-' + lineIndex()"
      [anchor]="true"
    >
      <input
        [id]="idPrefix() + '-m-code-' + lineIndex()"
        class="doc-form__input"
        type="text"
        [formControl]="line().controls.articleCode"
        placeholder="—"
        autocomplete="off"
        [attr.aria-expanded]="codeChoice()?.field === 'articleCode'"
        [attr.aria-controls]="idPrefix() + '-m-code-choice-' + lineIndex()"
        (focus)="codeFocused.emit('articleCode')"
        (blur)="codeBlurred.emit('articleCode')"
        (keydown.enter)="codeCommitted.emit('articleCode'); $event.preventDefault()"
      />
      @if (codeChoice()?.field === 'articleCode') {
        <app-document-line-suggestions
          [items]="codeChoice()!.items"
          [activeIndex]="null"
          [listboxId]="idPrefix() + '-m-code-choice-' + lineIndex()"
          ariaLabel="Articoli con questo codice"
          (picked)="pickCodeSuggestion($event)"
        />
      }
    </app-document-line-card-field>

    <app-document-line-card-field
      label="SKU"
      [controlId]="idPrefix() + '-m-sku-' + lineIndex()"
      [anchor]="true"
    >
      <input
        [id]="idPrefix() + '-m-sku-' + lineIndex()"
        class="doc-form__input"
        type="text"
        [formControl]="line().controls.sku"
        placeholder="—"
        autocomplete="off"
        [attr.aria-expanded]="codeChoice()?.field === 'sku'"
        [attr.aria-controls]="idPrefix() + '-m-sku-choice-' + lineIndex()"
        (focus)="codeFocused.emit('sku')"
        (blur)="codeBlurred.emit('sku')"
        (keydown.enter)="codeCommitted.emit('sku'); $event.preventDefault()"
      />
      @if (codeChoice()?.field === 'sku') {
        <app-document-line-suggestions
          [items]="codeChoice()!.items"
          [activeIndex]="null"
          [listboxId]="idPrefix() + '-m-sku-choice-' + lineIndex()"
          ariaLabel="Articoli con questo SKU"
          (picked)="pickCodeSuggestion($event)"
        />
      }
    </app-document-line-card-field>

    <app-document-line-card-field
      label="EAN"
      [controlId]="idPrefix() + '-m-barcode-' + lineIndex()"
      [full]="true"
      [anchor]="true"
    >
      <input
        [id]="idPrefix() + '-m-barcode-' + lineIndex()"
        class="doc-form__input"
        type="text"
        [formControl]="line().controls.barcode"
        placeholder="—"
        autocomplete="off"
        [attr.aria-expanded]="codeChoice()?.field === 'barcode'"
        [attr.aria-controls]="idPrefix() + '-m-barcode-choice-' + lineIndex()"
        (focus)="codeFocused.emit('barcode')"
        (blur)="codeBlurred.emit('barcode')"
        (keydown.enter)="codeCommitted.emit('barcode'); $event.preventDefault()"
      />
      @if (codeChoice()?.field === 'barcode') {
        <app-document-line-suggestions
          [items]="codeChoice()!.items"
          [activeIndex]="null"
          [listboxId]="idPrefix() + '-m-barcode-choice-' + lineIndex()"
          ariaLabel="Articoli con questo EAN"
          (picked)="pickCodeSuggestion($event)"
        />
      }
    </app-document-line-card-field>

    <app-document-line-card-field label="Nome prodotto" [full]="true">
      <app-document-line-product-cell
        [lineIndex]="lineIndex()"
        [value]="line().controls.description.value"
        [linked]="!!line().controls.variantId.value"
        [disabled]="disabled()"
        [invalid]="nameInvalid()"
        [suggestions]="suggestions()"
        [suggestionsOpen]="suggestionsOpen()"
        (valueChange)="nameInput.emit($event)"
        (focused)="nameFocus.emit($event)"
        (blurred)="nameBlur.emit($event)"
        (searchOpen)="searchProduct.emit($event)"
        (suggestionPick)="suggestionPick.emit($event)"
      />
      @if (nameInvalid()) {
        <p class="doc-form__error">Campo obbligatorio.</p>
      }
    </app-document-line-card-field>

    <app-document-line-card-group label="Vendita" />

    <app-document-line-card-field
      label="Sconto"
      [controlId]="idPrefix() + '-m-discount-' + lineIndex()"
    >
      <input
        [id]="idPrefix() + '-m-discount-' + lineIndex()"
        class="doc-form__input"
        type="text"
        [formControl]="line().controls.discount"
        placeholder="es. 10%"
        autocomplete="off"
      />
    </app-document-line-card-field>

    <app-document-line-card-field label="Codice IVA">
      <!--
        Stessa cella a ricerca-e-selezione delle righe desktop: si digita il
        codice e l'elenco filtra per prefisso. `inColumnCycle=false` perché qui
        le colonne non esistono e il Tab resta al browser.
      -->
      <app-document-line-select-cell
        [lineIndex]="lineIndex()"
        [inputId]="idPrefix() + '-m-vat-' + lineIndex()"
        ariaLabel="Codice IVA riga"
        placeholder="Predefinito…"
        [options]="vatOptions()"
        [value]="line().controls.vatCodeId.value"
        [disabled]="disabled()"
        [inColumnCycle]="false"
        (valueChange)="vatSelected.emit($event)"
      />
    </app-document-line-card-field>

    @if (showLoadsStock()) {
      <app-document-line-card-field [label]="loadsStockLabel()" [full]="true">
        <label class="sd-card__check" [for]="idPrefix() + '-m-stock-' + lineIndex()">
          <input
            [id]="idPrefix() + '-m-stock-' + lineIndex()"
            type="checkbox"
            [formControl]="line().controls.loadsStock"
          />
          <span>La riga scarica la giacenza al salvataggio</span>
        </label>
      </app-document-line-card-field>
    }
  </ng-container>
</app-document-line-card>
