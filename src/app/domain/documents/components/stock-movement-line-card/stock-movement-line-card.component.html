<app-document-line-card
  [lineIndex]="lineIndex()"
  [open]="open()"
  [readOnly]="disabled()"
  [canRemove]="canRemove()"
  [title]="line().controls.description.value"
  [meta]="metaItems()"
  (toggled)="toggle()"
  (removeRequested)="removed.emit(lineIndex())"
  (removed)="removed.emit(lineIndex())"
  (duplicated)="duplicated.emit(lineIndex())"
>
  <!--
    Un valore solo nella striscia, ed è giusto così: su un movimento la quantità
    è tutto ciò che si legge senza aprire. Dove gli altri documenti hanno prezzo
    e totale, qui non c'è niente da mettere — e mettere qualcosa per riempire il
    posto sarebbe peggio del posto vuoto.
  -->
  <ng-container cardControls>
    <app-document-line-card-control label="Quantità">
      <input
        class="mov-card__qty-input tabular-nums"
        type="number"
        min="1"
        step="1"
        inputmode="numeric"
        [formControl]="line().controls.quantity"
        [attr.aria-label]="'Quantità riga ' + (lineIndex() + 1)"
      />
    </app-document-line-card-control>
  </ng-container>

  <ng-container cardBody>
    <app-document-line-card-group label="Articolo" [first]="true" />

    <app-document-line-card-field label="Variante / SKU" [full]="true">
      <app-select-menu
        [options]="variantOptions()"
        [value]="line().controls.variantId.value"
        ariaLabel="Variante"
        placeholder="Cerca SKU o articolo…"
        [fullWidth]="true"
        [searchable]="true"
        searchPlaceholder="Min. 2 caratteri…"
        searchAriaLabel="Cerca variante"
        [invalid]="variantInvalid()"
        (searchChange)="variantSearch.emit($event)"
        (valueChange)="variantSelected.emit($event)"
      />
      @if (variantInvalid()) {
        <p class="doc-form__error">Campo obbligatorio.</p>
      }
    </app-document-line-card-field>

    <app-document-line-card-field
      label="Descrizione"
      [controlId]="idPrefix() + '-m-desc-' + lineIndex()"
      [full]="true"
    >
      <input
        [id]="idPrefix() + '-m-desc-' + lineIndex()"
        class="doc-form__input"
        type="text"
        [formControl]="line().controls.description"
      />
    </app-document-line-card-field>

    <app-document-line-card-field
      label="Seriali"
      [controlId]="idPrefix() + '-m-serials-' + lineIndex()"
      [full]="true"
    >
      <input
        [id]="idPrefix() + '-m-serials-' + lineIndex()"
        class="doc-form__input"
        type="text"
        [formControl]="line().controls.serialNumbersText"
        placeholder="SN001, SN002"
        autocomplete="off"
      />
    </app-document-line-card-field>
  </ng-container>
</app-document-line-card>
