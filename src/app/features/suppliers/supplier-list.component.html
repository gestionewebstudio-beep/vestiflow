<app-list-page
  class="supplier-list"
  pageTitle="Fornitori"
  [loading]="loading()"
  [error]="error()?.message ?? null"
  [isEmpty]="isEmpty()"
  [skeletonColumns]="skeletonColumns"
  emptyTitle="Nessun fornitore"
  emptyDescription="Non ci sono fornitori che corrispondono ai criteri di ricerca."
  emptyIcon="pi-truck"
  searchPlaceholder="Cerca per nome, codice o P. IVA…"
  searchAriaLabel="Cerca fornitori"
  [searchValue]="searchDraft()"
  [columnsViewId]="tableViewId"
  (searchChange)="searchDraft.set($event)"
  (filtersCleared)="resetFilters()"
  (retry)="reload()"
>
  <app-supplier-table
    data
    [suppliers]="suppliers()"
    [columns]="tableColumns()"
    [selectedIds]="selectedSupplierIds()"
    (selectionToggle)="toggleSupplierSelection($event.supplierId, $event.selected)"
    (selectAllToggle)="toggleSelectAll($event)"
    (rowClick)="openSupplier($event)"
  />

  <!--
    ⛔ **Qui c'era l'impaginazione**, tolta il 30/08/2026: un elenco mostra tutte
    le righe del filtro attivo (`regole-stile-ui`, «NESSUN TETTO DI RIGHE»).

    ⚠️ Il conteggio lo dice la riga totali del motore, «N voci», che ora conta il
    risultato intero invece della pagina.
  -->

  <!--
    ⭐ **Tutti i comandi in UNA riga in basso**, totali subito sopra — decisione
    del proprietario, 30/08/2026, sul riferimento Danea.

    ⛔ «Nuovo» stava in testata. Non è stato duplicato: si è SPOSTATO. Due posti
    per i comandi erano una divisione storica — creare sopra, agire sotto — non
    un criterio, e costavano all'operatore la domanda «dove sarà questo?».
  -->
  <div listActions>
    <app-list-actions-bar
      [count]="selectedSupplierIds().size"
      [ids]="[...selectedSupplierIds()]"
      [actions]="listActions()"
      clearLabel="Deseleziona"
      (cleared)="clearSelection()"
    />
  </div>

  <!--
    ⚠️ Nello slot `overlays`: le cose `position: fixed` hanno una casella loro nel
    telaio, e il contenuto proiettato che non trova uno slot Angular lo elimina
    dal DOM, senza errori.
  -->
  <app-delete-confirm
    overlays
    [(open)]="deleteWarnOpen"
    [title]="deleteWarnTitle()"
    [consequence]="deleteWarnMessage()"
    [busy]="deleteBusy()"
    (confirmed)="onDeleteConfirm()"
    (dismissed)="onDeleteCancel()"
  />
</app-list-page>
