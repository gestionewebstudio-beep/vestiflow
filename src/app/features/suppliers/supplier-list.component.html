<app-list-page
  class="supplier-list"
  pageTitle="Fornitori"
  [loading]="loading()"
  [error]="error()?.message ?? null"
  [isEmpty]="isEmpty()"
  [skeletonColumns]="skeletonColumns"
  emptyTitle="Nessun fornitore"
  emptyDescription="Non ci sono fornitori che corrispondono ai criteri di ricerca."
  emptyIcon="pi-truck"
  searchPlaceholder="Cerca per nome, codice o P. IVA…"
  searchAriaLabel="Cerca fornitori"
  [searchValue]="searchDraft()"
  [columnsViewId]="tableViewId"
  (searchChange)="searchDraft.set($event)"
  (filtersCleared)="resetFilters()"
  (retry)="reload()"
>
  <!--
    ⚠️ L'attributo di proiezione sta su un elemento STABILE, con l'`@if` dentro.
    Una proiezione che non aggancia non fallisce: il contenuto sparisce e basta,
    senza errori e senza test rossi.
  -->
  <div pageActions>
    @if (canManage()) {
      <app-button variant="primary" [routerLink]="['/app/suppliers/new']">
        <i class="pi pi-plus" aria-hidden="true"></i>
        Nuovo fornitore
      </app-button>
    }
  </div>

  <app-supplier-table
    data
    [suppliers]="suppliers()"
    [columns]="tableColumns()"
    (rowClick)="openSupplier($event)"
  />

  <app-pagination
    summary
    label="Paginazione fornitori"
    [meta]="meta()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
</app-list-page>
