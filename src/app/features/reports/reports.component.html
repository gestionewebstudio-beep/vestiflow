<section class="reports">
  <header class="reports__header">
    <h1 class="reports__title">Report</h1>
    <p class="reports__subtitle">{{ pageSubtitle() }}</p>
  </header>

  <!-- Il link ENTRA nel Registro: condizione della rotta, non dell’export. -->
  @if (canOpenCorrispettiviRegister()) {
    <div class="reports__corrispettivi-link">
      <a routerLink="/app/sales/corrispettivi" class="reports__corrispettivi-anchor">
        Apri registro corrispettivi commercialista →
      </a>
    </div>
  }

  <!--
    ⛔ Qui c'era il vecchio blocco «Export Corrispettivi», rimosso il 03/09/2026:
    produceva un file moltiplicando i movimenti per il prezzo di LISTINO CORRENTE,
    quindi lo stesso periodo valeva importi diversi a ogni cambio di listino. Il
    Registro canonico (Vendite → Corrispettivi) è l'unica fonte, e il link sopra
    ci porta.

    ⚠️ Il pannello analitico torna a gestire il periodo DA SÉ, come nella
    dashboard: `hidePeriodFilter` era acceso perché il selettore glielo forniva
    la card appena rimossa. Senza questa riga la pagina sarebbe rimasta senza
    alcun modo di cambiare periodo.
  -->
  <app-business-analytics-panel layout="reports" />

  @if (loading()) {
    <app-table-skeleton [columns]="4" [rows]="6" />
  } @else if (error(); as appError) {
    <app-error-state [description]="appError.message" retryLabel="Riprova" (retry)="reload()" />
  } @else {
    <div class="reports__body">
      <section class="reports__panel" aria-labelledby="report-inventory">
        <div class="reports__panel-head">
          <div class="reports__panel-heading">
            <h2 id="report-inventory" class="reports__panel-title">Giacenze per location</h2>
            <p class="reports__panel-hint">Snapshot attuale — non filtrato per periodo</p>
          </div>
        </div>
        <app-report-location-table [rows]="locationRows()" />
      </section>
    </div>
  }
</section>
