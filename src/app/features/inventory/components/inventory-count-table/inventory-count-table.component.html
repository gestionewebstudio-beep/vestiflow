<!--
  ⭐ **Lo scheletro è del motore comune** (`14` parte H) dal 30/08/2026 — ultimo
  elenco a entrarci, segnalato dal proprietario.

  ⛔ **Qui c'erano sette `<th>` scritti a mano** e un `<td>` per colonna: niente
  selettore Colonne, niente larghezze, niente riga totali, niente selezione.
-->
<app-data-table
  caption="Sessioni di inventario"
  [columns]="columns()"
  [sections]="sections()"
  [rowId]="rowId"
  [cellText]="cellText"
  [rowClickable]="true"
  [rowLabel]="rowLabelFor"
  [totals]="totals()"
  rowActionsLabel="Azioni"
  (rowClick)="rowClick.emit($event)"
>
  <ng-template appCell="status" let-session>
    <app-badge [flat]="true" [tone]="statusTone(session.status)">
      {{ statusLabel(session.status) }}
    </app-badge>
  </ng-template>

  <!--
    ⚠️ **Si elimina SOLO una sessione annullata**, ed è una regola di dominio: una
    sessione in corso o chiusa è un fatto di magazzino, e cancellarla toglierebbe
    la traccia di un conteggio avvenuto.
  -->
  <ng-template appRowActions let-session>
    @if (session.status === InventoryCountStatus.Cancelled) {
      <button
        type="button"
        class="count-table__action-btn"
        [attr.aria-label]="'Elimina sessione ' + session.name"
        title="Elimina sessione"
        (click)="onDeleteClick($event, session)"
      >
        <i class="pi pi-trash" aria-hidden="true"></i>
      </button>
    }
  </ng-template>
</app-data-table>
