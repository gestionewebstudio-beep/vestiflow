<!-- ⭐ Sul motore comune (`docs/26` A20): gli ordini che compongono l'Impegnata. -->
<app-data-table
  caption="Ordini che impegnano la quantità"
  [columns]="colonne"
  [sections]="sezioni()"
  [rowId]="rowId"
  [cellText]="testoCella"
  [sortable]="true"
  [sort]="ordine()"
  (sortChange)="ordine.set($event)"
  [totals]="totali()"
>
  <ng-template appRowCard let-r>
    <div class="list-card__head">
      <span class="list-card__ident">
        <span class="list-card__when">{{ channelLabel(r.channel) }}</span>
        <span class="list-card__what tabular-nums">{{ r.orderNumber }}</span>
      </span>
    </div>
    <div class="list-card__words">
      <span>{{ r.locationName }}</span>
    </div>
    <div class="list-card__figures">
      <span class="list-card__total tabular-nums">Qtà {{ r.quantity }}</span>
    </div>
  </ng-template>
</app-data-table>
