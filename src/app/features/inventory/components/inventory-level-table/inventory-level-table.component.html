<!--
  ⭐ **Lo scheletro è del motore comune** (`14` parte H).

  ⛔ **Qui c'erano 124 righe**: un `@switch (col.id)` con nove rami, ognuno un
  `<td>` con le stesse tre dichiarazioni — classe, `pinned`, `data-label`. Su nove
  colonne di cui **sette sono solo testo o numeri**, quel markup non diceva niente
  che `cellText` non dica meglio.

  Restano le due celle che non sono testo: la quantità impegnata, che è un
  comando, e lo stato.
-->
<app-data-table
  caption="Giacenze per variante e sede"
  [columns]="columns()"
  [sections]="sections()"
  [rowId]="rowId"
  [cellText]="cellText"
  [totals]="totals()"
>
  <!--
    ⭐ **La quantità impegnata è un COMANDO quando c'è**: apre gli ordini che la
    compongono. A zero non c'è niente da aprire, e resta un numero — un pulsante
    che non porta da nessuna parte è una promessa mancata.
  -->
  <ng-template appCell="committed" let-row>
    @if (row.committed > 0) {
      <button
        type="button"
        class="level-table__committed-link tabular-nums"
        title="Vedi gli ordini che compongono la quantità impegnata"
        (click)="onCommittedClick(row)"
      >
        {{ row.committed }}
      </button>
    } @else {
      {{ row.committed }}
    }
  </ng-template>

  <ng-template appCell="status" let-row>
    <app-badge [flat]="true" [tone]="statusTone(row.status)">{{
      statusLabel(row.status)
    }}</app-badge>
  </ng-template>
</app-data-table>
