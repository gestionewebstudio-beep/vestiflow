<app-list-page
  class="inventory-count-list"
  pageTitle="Inventario"
  pageDescription="Conteggio periodico delle giacenze per location. Alla chiusura genera rettifiche tracciate e aggiorna il magazzino."
  [showBack]="true"
  [loading]="loading()"
  [error]="error()?.message ?? null"
  [isEmpty]="isEmpty()"
  [skeletonColumns]="skeletonColumns"
  [skeletonRows]="6"
  emptyTitle="Nessuna sessione inventario"
  emptyDescription="Avvia un inventario fisico per confrontare le quantità di sistema con il conteggio reale in negozio o magazzino."
  emptyIcon="pi-list-check"
  (retry)="reload()"
>
  <app-inventory-tabs tabs />

  <app-inventory-count-table
    data
    [sessions]="sessions()"
    (rowClick)="openSession($event)"
    (deleteClick)="requestDelete($event)"
  />

  <!--
    ⭐ **Tutti i comandi in UNA riga in basso** — decisione del proprietario,
    30/08/2026. «Nuova sessione» stava in testata: si è spostata, non duplicata.

    ⚠️ Il sottotitolo non si rende più: resta come `pageDescription` per i
    lettori di schermo. Prendeva due righe per dire cosa la schermata è, in una
    vista che serve a consultare.
  -->
  <div listActions>
    <app-list-actions-bar [actions]="listActions()" />
  </div>
</app-list-page>

<!--
  ⚠️ Il dialogo sta FUORI dal telaio: è `position: fixed`, non occupa nessuna
  zona. Dentro, senza slot, Angular lo scarterebbe in silenzio.
-->
<app-delete-confirm
  [(open)]="deleteDialogOpen"
  title="Eliminare la sessione?"
  [consequence]="deleteConfirmMessage()"
  [busy]="deleteLoading()"
  (confirmed)="confirmDelete()"
/>
