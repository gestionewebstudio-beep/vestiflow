@let riga = line();

<!--
  La forma è della card condivisa (`app-document-line-card`), la stessa che monta
  l'Ordine cliente: qui dentro c'è solo quello che il banco ha da dire.
-->
<app-document-line-card
  [lineIndex]="lineIndex()"
  [open]="open()"
  [title]="riga.description"
  [meta]="metaItems()"
  [alert]="availabilityHint()"
  (toggled)="toggled.emit()"
  (removed)="removed.emit()"
>
  <!-- I valori sempre visibili: si modificano senza aprire la card. -->
  <ng-container cardControls>
    <app-document-line-card-control label="Quantità">
      <div class="ss-card__qty">
        <button
          type="button"
          class="ss-card__qty-btn"
          aria-label="Diminuisci quantità"
          [disabled]="riga.quantity <= 1"
          (click)="quantityStepped.emit(-1)"
        >
          <i class="pi pi-minus" aria-hidden="true"></i>
        </button>
        <input
          class="ss-card__qty-input tabular-nums"
          type="number"
          min="1"
          step="1"
          inputmode="numeric"
          aria-label="Quantità"
          [value]="riga.quantity"
          (input)="quantityChanged.emit(onInput($event))"
        />
        <button
          type="button"
          class="ss-card__qty-btn"
          aria-label="Aumenta quantità"
          (click)="quantityStepped.emit(1)"
        >
          <i class="pi pi-plus" aria-hidden="true"></i>
        </button>
      </div>
    </app-document-line-card-control>

    <app-document-line-card-control [label]="priceLabel()">
      <input
        class="ss-card__price-input tabular-nums"
        type="text"
        inputmode="decimal"
        placeholder="0,00"
        [attr.aria-label]="priceLabel()"
        [value]="priceValue()"
        (change)="priceChanged.emit(onInput($event))"
      />
    </app-document-line-card-control>

    <app-document-line-card-control label="Totale">
      <span class="ss-card__total tabular-nums">{{ lineTotal() }}</span>
    </app-document-line-card-control>
  </ng-container>

  <ng-container cardBody>
    <app-document-line-card-group label="Articolo" [first]="true" />

    <app-document-line-card-field
      label="Descrizione"
      [controlId]="'ss-m-desc-' + lineIndex()"
      [full]="true"
    >
      <input
        [id]="'ss-m-desc-' + lineIndex()"
        type="text"
        [value]="riga.description"
        (change)="descriptionChanged.emit(onInput($event))"
      />
    </app-document-line-card-field>

    <app-document-line-card-field label="SKU" [readonly]="true" [anchor]="true">
      <span class="ss-card__mono">{{ riga.sku }}</span>
    </app-document-line-card-field>

    <app-document-line-card-group label="Vendita" />

    <app-document-line-card-field label="Sconto" [controlId]="'ss-m-discount-' + lineIndex()">
      <input
        [id]="'ss-m-discount-' + lineIndex()"
        type="text"
        inputmode="decimal"
        [value]="riga.discountPercent"
        (change)="discountChanged.emit(onInput($event))"
      />
    </app-document-line-card-field>

    <app-document-line-card-field label="IVA">
      <app-select-menu
        [options]="vatOptions()"
        [value]="riga.vatCodeId ?? ''"
        ariaLabel="Codice IVA della riga"
        placeholder="IVA"
        [fullWidth]="true"
        (valueChange)="vatChanged.emit($event ?? '')"
      />
    </app-document-line-card-field>

    <!-- ⚠️ La spunta sta QUI e non fra i valori sempre visibili: è l'eccezione,
         non il gesto ripetuto (`11` A15). L'etichetta la porta il modo. -->
    <app-document-line-card-field
      [label]="stockToggleLabel()"
      [controlId]="'ss-m-stock-' + lineIndex()"
    >
      <input
        [id]="'ss-m-stock-' + lineIndex()"
        type="checkbox"
        [checked]="riga.loadsStock"
        (change)="stockToggled.emit(onChecked($event))"
      />
    </app-document-line-card-field>
  </ng-container>
</app-document-line-card>
