<!--
  La forma è della card condivisa; qui c'è quello che un ARRIVO MERCE ha da
  dire: costo nella modalità netto/ivato del documento, prezzo di vendita e
  barrato, e il flag «carica magazzino» che dice se questa riga muove giacenza.

  Due cose cambiano rispetto a prima, e discendono dall'adottare la forma:
  il nome prodotto si modifica nel corpo — nella testata è il titolo, come in
  ogni altro documento — e l'interruttore «Dettagli economici» sparisce, perché
  ad aprire la card ci pensa il chevron della testata.
-->
<app-document-line-card
  [lineIndex]="lineIndex()"
  [open]="detailsOpen()"
  [complete]="!incomplete()"
  [readOnly]="disabled()"
  [canRemove]="canRemove()"
  [title]="linked() ? productLabel() : line().controls.productName.value"
  [meta]="metaItems()"
  [alert]="incomplete() ? 'Riga incompleta: collega un articolo e verifica quantità e costo.' : ''"
  (toggled)="toggleDetails()"
  (removeRequested)="removed.emit(lineIndex())"
  (removed)="removed.emit(lineIndex())"
  (duplicated)="duplicated.emit(lineIndex())"
>
  <ng-container cardControls>
    <app-document-line-card-control label="Quantità">
      <input
        class="gr-card__qty-input tabular-nums"
        type="number"
        min="0"
        step="1"
        [formControl]="line().controls.quantity"
        aria-label="Quantità"
        (blur)="fieldBlur.emit(lineIndex())"
      />
    </app-document-line-card-control>

    <app-document-line-card-control [label]="costLabel()">
      <input
        class="gr-card__cost-input tabular-nums"
        type="text"
        inputmode="decimal"
        [formControl]="line().controls.unitCost"
        placeholder="0,00"
        aria-label="Costo unitario"
        (blur)="fieldBlur.emit(lineIndex())"
      />
    </app-document-line-card-control>

    <app-document-line-card-control label="Totale riga">
      <span class="gr-card__total tabular-nums">
        @if (grossLabel(); as gross) {
          <s class="gr-card__gross">{{ gross }}</s>
        }
        {{ totalLabel() }}
      </span>
    </app-document-line-card-control>
  </ng-container>

  <ng-container cardBody>
    <app-document-line-card-group label="Articolo" [first]="true" />

    <app-document-line-card-field label="Nome prodotto" [full]="true">
      <div class="gr-card__search">
        <input
          class="doc-form__input"
          type="text"
          [formControl]="line().controls.productName"
          placeholder="Nome prodotto…"
          [attr.aria-label]="'Nome prodotto riga ' + (lineIndex() + 1)"
          autocomplete="off"
          role="combobox"
          [attr.aria-expanded]="suggestionsOpen()"
          [attr.aria-controls]="'gr-card-suggestions-' + lineIndex()"
          (input)="onNameInput($any($event.target).value)"
          (focus)="nameFocus.emit(lineIndex())"
          (blur)="nameBlur.emit(lineIndex())"
        />
        <button
          type="button"
          class="gr-card__search-btn"
          [disabled]="disabled()"
          aria-label="Cerca articolo"
          (mousedown)="$event.preventDefault()"
          (click)="searchProduct.emit(lineIndex())"
        >
          <i class="pi pi-search" aria-hidden="true"></i>
        </button>
        @if (suggestionsOpen()) {
          <app-document-line-suggestions
            [items]="suggestionItems()"
            [listboxId]="'gr-card-suggestions-' + lineIndex()"
            ariaLabel="Articoli suggeriti"
            (picked)="pickSuggestion($event)"
          />
        }
      </div>
    </app-document-line-card-field>

    <app-document-line-card-group label="Magazzino" />

    <app-document-line-card-field label="U.m.">
      <app-document-line-unit-cell
        [lineIndex]="lineIndex()"
        [value]="unitOfMeasure()"
        [options]="unitOfMeasureOptions()"
        [disabled]="disabled()"
        [inColumnCycle]="false"
        (valueChange)="unitOfMeasureChanged.emit($event)"
        (manageRequested)="unitManagerRequested.emit()"
      />
    </app-document-line-card-field>

    <app-document-line-card-field label="Carica magazzino">
      <!--
        Il flag decide se questa riga muove giacenza: righe di spesa o servizio
        non la muovono. È del documento d'acquisto, non della forma.
      -->
      <label class="gr-card__check">
        <input
          type="checkbox"
          [formControl]="line().controls.loadsStock"
          (change)="fieldBlur.emit(lineIndex())"
        />
        Carica
      </label>
    </app-document-line-card-field>

    <app-document-line-card-group label="Costi e prezzi" />

    <app-document-line-card-field label="Sconto">
      <input
        class="doc-form__input"
        type="text"
        [formControl]="line().controls.discountPercent"
        placeholder="0%"
        aria-label="Sconto"
        (blur)="fieldBlur.emit(lineIndex())"
      />
    </app-document-line-card-field>

    <app-document-line-card-field label="IVA">
      <!--
        Stessa cella della tabella, fuori dal giro delle colonne: su card le
        colonne non ci sono, quindi il Tab resta al browser.
      -->
      <app-document-line-select-cell
        [lineIndex]="lineIndex()"
        ariaLabel="Codice IVA riga"
        [options]="vatOptions()"
        [value]="vatValue()"
        [disabled]="disabled()"
        [inColumnCycle]="false"
        (valueChange)="vatChange.emit($event)"
      />
    </app-document-line-card-field>

    <app-document-line-card-field label="Prezzo di vendita">
      <input
        class="doc-form__input"
        type="text"
        inputmode="decimal"
        [formControl]="line().controls.sellingPrice"
        placeholder="0,00"
        aria-label="Prezzo di vendita"
        (blur)="fieldBlur.emit(lineIndex())"
      />
    </app-document-line-card-field>

    <app-document-line-card-field label="Prezzo barrato">
      <input
        class="doc-form__input"
        type="text"
        inputmode="decimal"
        [formControl]="line().controls.compareAtPrice"
        placeholder="0,00"
        aria-label="Prezzo barrato"
        (blur)="fieldBlur.emit(lineIndex())"
      />
    </app-document-line-card-field>
  </ng-container>
</app-document-line-card>
