<app-list-page
  class="po-list"
  pageTitle="Ordini Fornitori"
  [showBack]="true"
  backFallback="/app/documents"
  [count]="loading() ? undefined : meta().total + (meta().total === 1 ? ' ordine' : ' ordini')"
  [loading]="loading()"
  [error]="error()?.message ?? null"
  [isEmpty]="isEmpty()"
  [skeletonColumns]="skeletonColumns"
  [columnsViewId]="tableViewId"
  [skeletonRows]="6"
  searchPlaceholder="Cerca per riferimento o fornitore…"
  searchAriaLabel="Cerca ordini fornitori"
  [searchValue]="searchDraft()"
  emptyTitle="Nessun ordine fornitore"
  emptyDescription="Nessun ordine corrisponde ai filtri attuali. Modifica i criteri o azzera i filtri."
  emptyIcon="pi-truck"
  [activeFilterCount]="activeFilterCount()"
  (searchChange)="searchDraft.set($event)"
  (filtersCleared)="resetFilters()"
  (retry)="reload()"
>
  <div period>
    <div class="po-list__field">
      <!-- Il segnaposto NON nomina un preset: qui c'era «Ultimi 30 giorni»,
         che e' gia' una scelta vera dell'elenco, e la voce vuota la
         ripeteva con l'effetto OPPOSTO — azzerare il filtro invece di
         applicarlo. Ad azzerare pensa «Tutti», che ha un nome suo. Stessa
         forma del filtro periodo dei Movimenti di magazzino. -->
      <app-select-menu
        chipLabel="Periodo"
        [options]="periodOptions"
        [value]="periodPreset()"
        ariaLabel="Filtra per periodo"
        placeholder="Periodo"
        [includeEmptyOption]="false"
        [compact]="true"
        [fullWidth]="true"
        [labelOnly]="true"
        (valueChange)="onPeriodPresetChange($event)"
      />
    </div>
  </div>

  <div filters>
    <div class="po-list__field">
      <app-select-menu
        chipLabel="Stato"
        [options]="statusOptions"
        [value]="query().status ?? ''"
        ariaLabel="Filtra per stato ordine"
        placeholder="Tutti"
        [compact]="true"
        [fullWidth]="true"
        (valueChange)="onStatusFilterChange($event)"
        [filterChip]="true"
      />
    </div>
  </div>

  <!--
    ⚠️ L'errore di AZIONE non è l'errore di caricamento: quello lo rende il
    telaio al posto della tabella, questo si affianca ai dati che restano
    visibili.
  -->
  <div warnings>
    @if (actionError(); as err) {
      <app-error-state [description]="err.message" />
    }
  </div>

  <app-data-table
    data
    caption="Ordini fornitore"
    [columns]="tableColumns()"
    [sections]="tableSections()"
    [rowId]="rowId"
    [totals]="totals()"
    [cellText]="cellText"
    [rowClickable]="true"
    [sortable]="true"
    [sort]="query().sort ?? []"
    [rowLabel]="rowLabel"
    selectionMode="multiple"
    [selectedIds]="selectedIds()"
    [selectionLabel]="selectionLabel"
    selectAllLabel="Seleziona tutti gli ordini"
    (rowClick)="openOrder($event)"
    (sortChange)="onSortChange($event)"
    (selectionChange)="onToggleSelection($event)"
    (selectAllChange)="onToggleSelectAll($event)"
  >
    <!-- L'unica cella che non è testo: lo stato, con la sua pill. -->
    <ng-template appCell="status" let-order>
      <app-badge [tone]="statusTone(order.status)">{{ statusLabel(order.status) }}</app-badge>
    </ng-template>

    <!--
      Le tre celle vestite di tipografia. Il TESTO resta uno solo (`cellText`):
      il template aggiunge il vestito, non una seconda verità.
    -->
    <ng-template appCell="reference" let-order>
      <span class="po-list__riferimento">{{ cellText(order, 'reference') }}</span>
    </ng-template>

    <ng-template appCell="lines" let-order>
      <span class="po-list__righe">{{ cellText(order, 'lines') }}</span>
    </ng-template>

    <ng-template appCell="expected" let-order>
      <span class="po-list__attesa">{{ cellText(order, 'expected') }}</span>
    </ng-template>
  </app-data-table>

  <!--
    ⭐ La barra azioni sta SOTTO i dati (`14` §21.1: dati → totali → funzioni).
    Qui stava sopra la tabella: la posizione è del telaio, e la regola esisteva
    già.
  -->
  <div listActions>
    <app-list-actions-bar
      [count]="selectionCount()"
      [ids]="[...selectedIds()]"
      [actions]="selectionActions()"
      labelSingular="ordine selezionato"
      labelPlural="ordini selezionati"
      (cleared)="clearSelection()"
    />
  </div>
</app-list-page>
