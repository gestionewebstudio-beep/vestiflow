<!--
  La forma è della card condivisa; qui c'è quello che un ORDINE FORNITORE ha da
  dire: costo nella modalità netto/ivato della testata, sconto, Codice IVA e il
  codice con cui il fornitore chiama l'articolo.
-->
<app-document-line-card
  [lineIndex]="lineIndex()"
  [open]="open()"
  [complete]="!incomplete()"
  [readOnly]="disabled()"
  [canRemove]="canRemove()"
  [title]="linked() ? productLabel() : line().controls.productName.value"
  [variantLabel]="line().controls.variantLabel.value"
  [meta]="metaItems()"
  [alert]="incomplete() ? 'Riga incompleta: collega un articolo e verifica quantità e costo.' : ''"
  (toggled)="toggle()"
  (removeRequested)="removed.emit(lineIndex())"
  (removed)="removed.emit(lineIndex())"
>
  <ng-container cardControls>
    <app-document-line-card-control label="Qtà">
      <input
        class="po-card__num-input tabular-nums"
        type="number"
        min="1"
        step="1"
        inputmode="numeric"
        [formControl]="line().controls.quantity"
        [attr.aria-label]="'Quantità riga ' + (lineIndex() + 1)"
      />
    </app-document-line-card-control>

    <app-document-line-card-control [label]="costLabel()">
      <input
        class="po-card__num-input tabular-nums"
        type="text"
        inputmode="decimal"
        [formControl]="line().controls.unitCost"
        placeholder="0,00"
        [attr.aria-label]="costLabel() + ' riga ' + (lineIndex() + 1)"
      />
    </app-document-line-card-control>

    <app-document-line-card-control label="Totale">
      <span class="po-card__total tabular-nums">{{ totalLabel() }}</span>
    </app-document-line-card-control>
  </ng-container>

  <ng-container cardBody>
    <app-document-line-card-group label="Articolo" [first]="true" />

    <app-document-line-card-field label="Nome prodotto" [full]="true">
      <div class="po-card__search">
        <input
          class="doc-form__input"
          type="text"
          [formControl]="line().controls.productName"
          placeholder="Nome prodotto…"
          [attr.aria-label]="'Nome prodotto riga ' + (lineIndex() + 1)"
          autocomplete="off"
          role="combobox"
          [attr.aria-expanded]="suggestionsOpen()"
          [attr.aria-controls]="'po-card-suggestions-' + lineIndex()"
          (input)="onNameInput($any($event.target).value)"
          (focus)="nameFocus.emit(lineIndex())"
          (blur)="nameBlur.emit(lineIndex())"
        />
        <button
          type="button"
          class="po-card__search-btn"
          [disabled]="disabled()"
          aria-label="Cerca articolo"
          (mousedown)="$event.preventDefault()"
          (click)="searchProduct.emit(lineIndex())"
        >
          <i class="pi pi-search" aria-hidden="true"></i>
        </button>
        @if (suggestionsOpen()) {
          <app-document-line-suggestions
            [items]="suggestionItems()"
            [listboxId]="'po-card-suggestions-' + lineIndex()"
            ariaLabel="Articoli suggeriti"
            (picked)="pickSuggestion($event)"
          />
        }
      </div>
    </app-document-line-card-field>

    <!--
      Il codice fornitore è la sola colonna che gli altri due documenti di questo
      giro non hanno: è il codice con cui QUESTO fornitore chiama l'articolo, ed
      è la ragione per cui l'ordine chiede il fornitore prima delle righe.
    -->
    <app-document-line-card-field
      label="Cod. fornitore"
      [controlId]="'po-m-suppcode-' + lineIndex()"
    >
      <input
        [id]="'po-m-suppcode-' + lineIndex()"
        class="doc-form__input"
        type="text"
        [formControl]="line().controls.supplierCode"
        placeholder="—"
        autocomplete="off"
      />
    </app-document-line-card-field>

    <app-document-line-card-field label="U.m.">
      <app-document-line-unit-cell
        [lineIndex]="lineIndex()"
        [value]="unitOfMeasure()"
        [options]="unitOfMeasureOptions()"
        [disabled]="disabled()"
        [inColumnCycle]="false"
        (valueChange)="unitOfMeasureChanged.emit($event)"
        (manageRequested)="unitManagerRequested.emit()"
      />
    </app-document-line-card-field>

    <app-document-line-card-group label="Costi" />

    <app-document-line-card-field label="Sconto" [controlId]="'po-m-discount-' + lineIndex()">
      <input
        [id]="'po-m-discount-' + lineIndex()"
        class="doc-form__input"
        type="text"
        [formControl]="line().controls.discount"
        placeholder="0%"
        title="Percentuale singola o cascata: «10%», «4+10%»"
      />
    </app-document-line-card-field>

    <app-document-line-card-field label="IVA">
      <!-- Fuori dal giro delle colonne: su card le colonne non ci sono. -->
      <app-document-line-select-cell
        [lineIndex]="lineIndex()"
        ariaLabel="Codice IVA riga"
        [options]="vatOptions()"
        [value]="vatValue()"
        [disabled]="disabled()"
        [inColumnCycle]="false"
        (valueChange)="vatChange.emit($event)"
      />
    </app-document-line-card-field>
  </ng-container>
</app-document-line-card>
