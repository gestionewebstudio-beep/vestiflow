<app-data-table
  caption="Ultime vendite"
  [columns]="colonne"
  [sections]="sezioni()"
  [rowId]="rowId"
  [cellText]="testoCella"
  [sortable]="true"
  [sort]="ordine()"
  (sortChange)="ordine.set($event)"
  [rowClickable]="true"
  [rowLabel]="rowLabel"
  (rowClick)="rowClick.emit($event)"
>
  <ng-template appCell="status" let-row>
    <app-badge [flat]="true" [tone]="statusTone(row.financialStatus)">
      {{ statusLabel(row.financialStatus) }}
    </app-badge>
  </ng-template>

  <!-- La card: numero e data in testa, cliente fra le parole, il totale come cifra. -->
  <ng-template appRowCard let-row>
    <div class="list-card__head">
      <span class="list-card__ident">
        <span class="list-card__when">{{ formatDate(row.placedAt) }}</span>
        <span class="list-card__what tabular-nums">{{ row.orderNumber }}</span>
      </span>
      <span class="list-card__anchor">
        <app-badge [flat]="true" [tone]="statusTone(row.financialStatus)">
          {{ statusLabel(row.financialStatus) }}
        </app-badge>
      </span>
    </div>
    <div class="list-card__words">
      <span>{{ row.customerName }}</span>
    </div>
    <div class="list-card__figures">
      <span class="list-card__total tabular-nums">{{ formatMoney(row.total) }}</span>
    </div>
  </ng-template>
</app-data-table>
