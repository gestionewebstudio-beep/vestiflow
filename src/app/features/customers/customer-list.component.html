<app-list-page
  class="customer-list"
  pageTitle="Clienti"
  [loading]="loading()"
  [error]="error()?.message ?? null"
  [isEmpty]="isEmpty()"
  [skeletonColumns]="skeletonColumns"
  [columnsViewId]="customerListView"
  searchPlaceholder="Cerca per nome o email…"
  searchAriaLabel="Cerca clienti"
  [searchValue]="searchDraft()"
  emptyTitle="Nessun cliente"
  emptyDescription="Nessun cliente corrisponde alla ricerca attuale."
  emptyIcon="pi-users"
  (searchChange)="searchDraft.set($event)"
  (filtersCleared)="resetFilters()"
  (retry)="reload()"
>
  <div warnings>
    @if (shopifySyncError(); as message) {
      <p class="customer-list__shopify-error" role="alert">{{ message }}</p>
    }

    @if (shopifyFeedback(); as feedback) {
      <app-shopify-sync-feedback
        [message]="feedback.message"
        [tone]="feedback.tone"
        (dismissed)="dismissShopifyFeedback()"
      />
    }
  </div>

  <app-customer-table
    data
    [customers]="customers()"
    [columns]="tableColumns()"
    [selectedIds]="selectedCustomerIds()"
    (rowClick)="openCustomer($event)"
    (selectionToggle)="toggleCustomerSelection($event.customerId, $event.selected)"
    (selectAllToggle)="toggleSelectAll($event)"
  />

  <!--
    ⛔ **Qui c'era l'impaginazione**, tolta il 30/08/2026: un elenco mostra tutte
    le righe del filtro attivo (`regole-stile-ui`, «NESSUN TETTO DI RIGHE»).

    ⚠️ **Il conteggio non si è perso**: lo dice la riga totali del motore, «N
    voci», che ora conta il risultato intero invece della pagina.
  -->
  <!--
    ⭐ **Tutti i comandi in UNA riga in basso**, totali subito sopra —
    decisione del proprietario, 30/08/2026, sul riferimento Danea.

    ⛔ Stavano in testata. Non sono duplicati: si sono SPOSTATI. Due posti
    per i comandi erano una divisione storica — creare sopra, agire sotto —
    non un criterio.
  -->
  <div listActions>
    <app-list-actions-bar
      [count]="selectedCustomerIds().size"
      [ids]="[...selectedCustomerIds()]"
      [actions]="listActions()"
      labelSingular="cliente selezionato"
      labelPlural="clienti selezionati"
      clearLabel="Deseleziona"
      (cleared)="clearSelection()"
    />
  </div>
</app-list-page>
