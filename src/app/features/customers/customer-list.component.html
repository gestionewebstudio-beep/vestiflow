<app-list-page
  class="customer-list"
  pageTitle="Clienti"
  [loading]="loading()"
  [error]="error()?.message ?? null"
  [isEmpty]="isEmpty()"
  [skeletonColumns]="skeletonColumns"
  [columnsViewId]="customerListView"
  searchPlaceholder="Cerca per nome o email…"
  searchAriaLabel="Cerca clienti"
  [searchValue]="searchDraft()"
  emptyTitle="Nessun cliente"
  emptyDescription="Nessun cliente corrisponde alla ricerca attuale."
  emptyIcon="pi-users"
  (searchChange)="searchDraft.set($event)"
  (filtersCleared)="resetFilters()"
  (retry)="reload()"
>
  <div pageActions>
    @if (canExportData()) {
      <app-button variant="secondary" [disabled]="exporting()" (click)="exportCustomers()">
        <i class="pi pi-download" aria-hidden="true"></i>
        @if (exporting()) {
          Export in corso…
        } @else {
          Esporta CSV
        }
      </app-button>
    }

    @if (showShopifyCustomersSync()) {
      <app-button
        variant="secondary"
        loadingIndicator="icon"
        [loading]="shopifyCustomersLoading()"
        [disabled]="shopifyCustomersLoading()"
        (click)="syncCustomersFromShopify()"
      >
        <i class="pi pi-sync" aria-hidden="true"></i>
        Sincronizza da Shopify
      </app-button>
    }

    @if (canManage()) {
      <app-button variant="primary" routerLink="/app/customers/new">
        <i class="pi pi-plus" aria-hidden="true"></i>
        Nuovo cliente
      </app-button>
    }
  </div>

  <div warnings>
    @if (shopifySyncError(); as message) {
      <p class="customer-list__shopify-error" role="alert">{{ message }}</p>
    }

    @if (shopifyFeedback(); as feedback) {
      <app-shopify-sync-feedback
        [message]="feedback.message"
        [tone]="feedback.tone"
        (dismissed)="dismissShopifyFeedback()"
      />
    }
  </div>

  <app-customer-table
    data
    [customers]="customers()"
    [columns]="tableColumns()"
    (rowClick)="openCustomer($event)"
  />

  <app-pagination
    summary
    label="Paginazione clienti"
    [meta]="meta()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
</app-list-page>
