<app-list-page
  class="customer-list"
  pageTitle="Clienti"
  [loading]="loading()"
  [error]="error()?.message ?? null"
  [isEmpty]="isEmpty()"
  [skeletonColumns]="skeletonColumns"
  [columnsViewId]="customerListView"
  searchPlaceholder="Cerca per nome o email…"
  searchAriaLabel="Cerca clienti"
  [searchValue]="searchDraft()"
  emptyTitle="Nessun cliente"
  emptyDescription="Nessun cliente corrisponde alla ricerca attuale."
  emptyIcon="pi-users"
  (searchChange)="searchDraft.set($event)"
  (filtersCleared)="resetFilters()"
  (retry)="reload()"
>
  <div warnings>
    @if (shopifySyncError(); as message) {
      <p class="customer-list__shopify-error" role="alert">{{ message }}</p>
    }

    @if (shopifyFeedback(); as feedback) {
      <app-shopify-sync-feedback
        [message]="feedback.message"
        [tone]="feedback.tone"
        (dismissed)="dismissShopifyFeedback()"
      />
    }
  </div>

  <app-customer-table
    data
    [customers]="customers()"
    [columns]="tableColumns()"
    (rowClick)="openCustomer($event)"
  />

  <app-pagination
    summary
    label="Paginazione clienti"
    [meta]="meta()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />

  <!--
    ⭐ **Tutti i comandi in UNA riga in basso**, totali subito sopra —
    decisione del proprietario, 30/08/2026, sul riferimento Danea.

    ⛔ Stavano in testata. Non sono duplicati: si sono SPOSTATI. Due posti
    per i comandi erano una divisione storica — creare sopra, agire sotto —
    non un criterio.
  -->
  <div listActions>
    <app-list-actions-bar [actions]="listActions()" />
  </div>
</app-list-page>
