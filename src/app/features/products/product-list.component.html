<app-list-page
  class="product-list"
  pageTitle="Prodotti"
  [loading]="loading()"
  [error]="error()?.message ?? null"
  [isEmpty]="isEmpty()"
  [skeletonColumns]="skeletonColumns()"
  [columnsViewId]="productListView"
  emptyTitle="Nessun prodotto"
  emptyDescription="Nessun prodotto corrisponde ai filtri attuali."
  emptyIcon="pi-tag"
  (retry)="reload()"
>
  <!--
    ⚠️ Ricerca e filtri stanno dentro `app-product-toolbar`, un componente di
    questa pagina. Il telaio non li conosce: proietta il componente intero nella
    zona dei filtri, che è dove la sua riga appartiene.
  -->
  <div filters>
    <app-product-toolbar
      [search]="searchDraft()"
      [filters]="query()"
      [categories]="filterOptions().categories"
      [brands]="filterOptions().brands"
      [seasons]="filterOptions().seasons"
      [statusOptions]="statusOptions"
      [hasActiveFilters]="hasActiveFilters()"
      [barcodeScannerEnabled]="barcodeScannerEnabled()"
      (searchChange)="onSearchInput($event)"
      (filterChange)="onFilterChange($event)"
      (resetFilters)="onResetFilters()"
      (barcodeScanned)="onBarcodeScanned($event)"
    />
  </div>

  <div warnings>
    @if (shopifySyncError(); as message) {
      <p class="product-list__shopify-error" role="alert">{{ message }}</p>
    }

    @if (shopifyFeedback(); as feedback) {
      <app-shopify-sync-feedback
        [message]="feedback.message"
        [tone]="feedback.tone"
        (dismissed)="dismissShopifyFeedback()"
      />
    }
    @if (draftCount() > 0 || draftFilterActive()) {
      <button
        type="button"
        class="product-list__drafts-chip"
        [class.product-list__drafts-chip--active]="draftFilterActive()"
        [attr.aria-pressed]="draftFilterActive()"
        (click)="toggleDraftFilter()"
      >
        <i class="pi pi-inbox" aria-hidden="true"></i>
        Articoli da completare
        <span class="product-list__drafts-count tabular-nums">{{ draftCount() }}</span>
      </button>
    }
    @if (scanFeedback(); as message) {
      <p class="product-list__scan-feedback" role="status">{{ message }}</p>
    }
    @if (duplicateError(); as message) {
      <app-error-state [description]="message" />
    }
  </div>

  <app-product-table
    data
    [products]="products()"
    [columns]="tableColumns()"
    [sortField]="query().sort"
    [sortOrder]="query().order"
    [selectedProductIds]="selectedProductIds()"
    [allOnPageSelected]="allOnPageSelected()"
    [someOnPageSelected]="someOnPageSelected()"
    [canManage]="canManageCatalog()"
    (rowClick)="openProduct($event)"
    (printLabel)="printProductLabels($event)"
    (duplicate)="duplicateProduct($event)"
    (selectionToggle)="toggleProductSelection($event.productId, $event.selected)"
    (selectAllToggle)="toggleSelectAllOnPage($event)"
    (sortChange)="onSortChange($event)"
  />

  <app-pagination
    summary
    label="Paginazione prodotti"
    [meta]="meta()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />

  <!--
    ⭐ **Tutte le funzioni nella barra in basso, e non si nascondono** (`14`
    §0.2). Qui c'era una barra fatta a mano che compariva solo a righe spuntate:
    chi non sapeva che si selezionano non vedeva nemmeno che le etichette si
    possono stampare. Ora è `app-list-actions-bar`, con `requires: 'oneOrMore'` —
    l'azione c'è sempre, e a selezione vuota è spenta CON il motivo.

    ⚠️ «Copie per etichetta» sta QUI e non fra i filtri: non restringe l'elenco,
    è un parametro della stampa, e appartiene al comando che lo usa.
  -->
  <div listActions>
    <app-list-actions-bar
      [count]="selectedCount()"
      [ids]="[...selectedProductIds()]"
      [actions]="selectionActions()"
      labelSingular="prodotto selezionato"
      labelPlural="prodotti selezionati"
      clearLabel="Deseleziona"
      (cleared)="clearSelection()"
    />

    <label class="product-list__label-copies">
      Copie per etichetta
      <input
        class="product-list__label-copies-input"
        type="number"
        min="1"
        max="500"
        step="1"
        [value]="labelCopies()"
        (change)="setLabelCopies($any($event.target).valueAsNumber)"
      />
    </label>
  </div>
</app-list-page>
