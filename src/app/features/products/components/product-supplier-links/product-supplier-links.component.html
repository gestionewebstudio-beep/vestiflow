@if (loading()) {
  <app-table-skeleton [columns]="4" [rows]="3" />
} @else if (links().length === 0) {
  <app-empty-state
    icon="pi-building"
    title="Nessun fornitore collegato"
    description="Associa codici fornitore e fornitore preferenziale dalle anagrafiche fornitori o dagli ordini."
  />
} @else {
  <!-- ⭐ Sul motore comune (`docs/26` A15): un piccolo elenco di consultazione nella scheda. -->
  <app-data-table
    caption="Fornitori dell’articolo"
    [columns]="colonne"
    [sections]="sezioni()"
    [rowId]="rowId"
    [cellText]="testoCella"
    [sortable]="true"
    [sort]="ordine()"
    (sortChange)="ordine.set($event)"
  >
    <ng-template appRowCard let-link>
      <div class="list-card__head">
        <span class="list-card__ident">
          <span class="list-card__what">{{ link.supplier.name }}</span>
        </span>
        @if (link.isPreferred) {
          <span class="list-card__anchor">Preferenziale</span>
        }
      </div>
      <div class="list-card__words">
        <span class="tabular-nums">{{ link.variant.sku }}</span>
        @if (link.supplierSku) {
          <span class="tabular-nums">Cod. fornitore {{ link.supplierSku }}</span>
        }
      </div>
      <div class="list-card__figures">
        <span class="list-card__total tabular-nums">{{ formatPrice(link) }}</span>
      </div>
    </ng-template>
  </app-data-table>
}
