<!--
  ⭐ **Lo scheletro non è più qui.** `thead`, `tbody`, il `@for` con `track`, le
  intestazioni ordinabili, le maniglie di ridimensionamento e la colonna di
  selezione li rende il motore comune (`14` parte H).

  ⛔ **Qui c'erano 243 righe** che rifacevano tutto questo a mano — inclusa una
  casella di selezione scritta a mano, un `@if (showColumn(...))` per ogni cella e
  il ripiego mobile a `data-label`. Ora restano le sole celle che NON sono testo:
  le tre pill e i due comandi di riga.

  ⚠️ Il testo delle celle semplici sta in `cellText` (nel `.ts`), non qui: una
  cella che è solo testo non ha bisogno di un template.
-->
<app-data-table
  caption="Elenco prodotti"
  [columns]="engineColumns()"
  [sections]="sections()"
  [rowId]="rowId"
  [cellText]="cellText"
  [rowClickable]="true"
  [rowLabel]="rowLabelFor"
  [sortable]="true"
  [sort]="sort()"
  [selectionMode]="selezionabile() ? 'multiple' : 'none'"
  [selectedIds]="selectedProductIds()"
  [totals]="totals()"
  [selectionLabel]="selectionLabel"
  selectAllLabel="Seleziona tutti i prodotti della pagina"
  (rowClick)="rowClick.emit($event)"
  (sortChange)="onSortChange($event)"
  (selectionChange)="selectionToggle.emit({ productId: $event.row.id, selected: $event.selected })"
  (selectAllChange)="selectAllToggle.emit($event)"
>
  <!--
    ⭐ **Tre stati, tre colori, nessuna pastiglia** (deciso il 30/08/2026).

    ⛔ Qui c'erano tre `app-badge` pieni: con dieci righe a schermo facevano
    TRENTA pastiglie, e un rilievo che compare su ogni riga di ogni colonna non
    segnala più niente — è il fondo normale dell'elenco. Il colore basta a dire
    quello che dicevano.

    ⚠️ **Restano badge**, in variante piatta: il colore del tono lo decide il
    design system, non questa tabella.
  -->
  <ng-template appCell="status" let-product>
    <app-badge [flat]="true" [tone]="statusTone(product.status)">{{
      statusLabel(product.status)
    }}</app-badge>
  </ng-template>

  <ng-template appCell="source" let-product>
    <app-badge [flat]="true" [tone]="sourceTone(product)">{{ sourceLabel(product) }}</app-badge>
  </ng-template>

  <ng-template appCell="shopify" let-product>
    <app-badge [flat]="true" [tone]="shopifyTone(product)">{{ shopifyLabel(product) }}</app-badge>
  </ng-template>
</app-data-table>
