<app-list-page
  class="os-list"
  pageTitle="Vendite online"
  [showBack]="true"
  [count]="loading() ? undefined : meta().total + (meta().total === 1 ? ' documento' : ' documenti')"
  [loading]="loading()"
  [error]="error()?.message ?? null"
  [isEmpty]="isEmpty()"
  [skeletonColumns]="skeletonColumns"
  [activeFilterCount]="activeFilterCount()"
  searchPlaceholder="Cerca per numero, ordine, cliente…"
  searchAriaLabel="Cerca vendite online"
  [searchValue]="searchDraft()"
  emptyTitle="Nessuna vendita online"
  emptyDescription="Le Vendite online vengono create automaticamente quando un ordine online risulta completamente evaso."
  emptyIcon="pi-send"
  (searchChange)="searchDraft.set($event)"
  (filtersCleared)="resetFilters()"
  (retry)="reload()"
>
  <!--
    ⭐ Il periodo resta in barra a ogni larghezza: è uno dei due che non entrano
    nelle colonne (`14` §0.2). Gli altri filtri vanno nel pannello sotto `lg`, e
    il pannello è del telaio.
  -->
  <div period>
    <div class="os-list__field os-list__field--date">
      <label class="os-list__label" for="online-sales-from">Evase dal</label>
      <app-date-input
        inputId="online-sales-from"
        [value]="query().fulfilledFrom ?? ''"
        ariaLabel="Data evasione da"
        placeholder="gg/mm/aaaa"
        [compact]="true"
        [fullWidth]="true"
        [max]="query().fulfilledTo || undefined"
        (valueChange)="onFulfilledFromChange($event)"
      />
    </div>

    <div class="os-list__field os-list__field--date">
      <label class="os-list__label" for="online-sales-to">al</label>
      <app-date-input
        inputId="online-sales-to"
        [value]="query().fulfilledTo ?? ''"
        ariaLabel="Data evasione a"
        placeholder="gg/mm/aaaa"
        [compact]="true"
        [fullWidth]="true"
        [min]="query().fulfilledFrom || undefined"
        (valueChange)="onFulfilledToChange($event)"
      />
    </div>
  </div>

  <div filters>
    <div class="os-list__field">
      <app-select-menu
        chipLabel="Canale"
        [options]="channelOptions"
        [value]="query().channel ?? ''"
        ariaLabel="Filtra per canale"
        placeholder="Tutti"
        [compact]="true"
        [fullWidth]="true"
        (valueChange)="onChannelFilterChange($event)"
        [filterChip]="true"
      />
    </div>
  </div>

  <app-online-sale-table data [sales]="sales()" (rowClick)="openSale($event)" />

  <app-pagination
    summary
    label="Paginazione vendite online"
    [meta]="meta()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
</app-list-page>
